name: Verify R8 design files
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify files, pin nets, BOM and coordinates
        run: python -B tools/verify.py
      - name: Run integrity and assembly regression tests
        run: python -B -m unittest discover -s tests -v
